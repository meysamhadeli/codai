name: Auto Labeler

# Labels decide which Release Drafter category a pull request lands in and whether the
# next release is a major, minor or patch bump, so they are derived from the Conventional
# Commit title and the branch name.

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - edited
      - labeled
      - unlabeled

permissions:
  contents: read
  pull-requests: write

jobs:
  auto-labeler:
    name: Auto Labeler
    runs-on: ubuntu-latest

    steps:
      - name: Apply labels
        uses: release-drafter/release-drafter@v7
        with:
          config-name: release-drafter.yml
          disable-releaser: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

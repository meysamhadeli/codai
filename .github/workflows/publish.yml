name: Publish NuGet packages

# Publishing is driven by the GitHub release, which Release Drafter prepares from merged
# pull requests. Publishing the draft is the only step a maintainer has to take: this
# workflow reads the tag, stamps every package with that version and pushes to nuget.org.

on:
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      version:
        description: Package version to publish, for example 2.0.1 or 2.1.0-beta.1
        required: true
        type: string

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  publish:
    name: Pack and push to nuget.org
    runs-on: ubuntu-latest

    steps:
      - name: Check out release source
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'release' && github.event.release.tag_name || github.ref }}

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Validate release version and NuGet API key
        shell: bash
        env:
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.event.release.tag_name }}
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        run: |
          package_version="${RELEASE_TAG#v}"
          if [[ ! "$package_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Release tag '$RELEASE_TAG' is not a supported NuGet version tag."
            exit 1
          fi
          if [[ -z "$NUGET_API_KEY" ]]; then
            echo "::error::Add NUGET_API_KEY as a repository Actions secret."
            exit 1
          fi
          echo "PACKAGE_VERSION=$package_version" >> "$GITHUB_ENV"

      - name: Restore
        run: dotnet restore Codai.slnx

      - name: Build release
        run: dotnet build Codai.slnx --no-restore --configuration Release -warnaserror -p:Version="$PACKAGE_VERSION"

      - name: Pack every src project
        shell: bash
        run: |
          mkdir -p artifacts/packages
          while IFS= read -r -d '' project; do
            dotnet pack "$project" \
              --no-restore \
              --no-build \
              --configuration Release \
              --output artifacts/packages \
              -p:Version="$PACKAGE_VERSION" \
              -p:PackageVersion="$PACKAGE_VERSION"
          done < <(find src -type f -name '*.csproj' -print0 | sort -z)

      - name: Verify every src project was packed
        shell: bash
        run: |
          project_count=$(find src -type f -name '*.csproj' | wc -l)
          package_count=$(find artifacts/packages -maxdepth 1 -name '*.nupkg' | wc -l)
          if [[ "$project_count" -ne "$package_count" ]]; then
            echo "::error::Expected $project_count packages, but produced $package_count."
            exit 1
          fi
          ls -1 artifacts/packages

      - name: Verify the tool package installs
        shell: bash
        run: |
          dotnet tool install Codai \
            --tool-path ./tool-verify \
            --add-source ./artifacts/packages \
            --version "$PACKAGE_VERSION"
          ./tool-verify/codai --version
          ./tool-verify/codai --help

      - name: Push packages to NuGet.org
        shell: bash
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        run: |
          shopt -s nullglob
          packages=(artifacts/packages/*.nupkg)
          if [[ ${#packages[@]} -eq 0 ]]; then
            echo "::error::No NuGet packages were produced."
            exit 1
          fi
          failed=0
          for package in "${packages[@]}"; do
            if ! dotnet nuget push "$package" \
              --api-key "$NUGET_API_KEY" \
              --source https://api.nuget.org/v3/index.json \
              --skip-duplicate; then
              echo "::warning::Failed to push $(basename "$package")."
              failed=1
            fi
          done
          if [[ "$failed" -ne 0 ]]; then
            echo "::error::One or more packages failed to push."
            exit 1
          fi

      - name: Upload packages as a workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: nuget-packages-${{ env.PACKAGE_VERSION }}
          path: artifacts/packages
          if-no-files-found: error

name: CI

on:
  push:
    branches: ["main"]
    paths-ignore:
      - "README.md"
      - "CHANGELOG.md"
      - "CONTRIBUTION.md"
      - "LICENSE"
      - ".gitignore"
      - ".gitattributes"
      - "assets/**"
  pull_request:
    branches: ["main"]
  workflow_dispatch:

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build-and-test:
    name: Build and test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Show SDK information
        run: dotnet --info

      - name: Restore
        run: dotnet restore Codai.slnx

      - name: Build
        run: dotnet build Codai.slnx --configuration Release --no-restore -warnaserror

      - name: Test
        # Live provider tests are opt-in (CODAI_RUN_INTEGRATION=1 + API_KEY) and never
        # run in CI, so no secrets are required here.
        run: >
          dotnet test Codai.slnx
          --configuration Release
          --no-build
          --logger "trx;LogFileName=test-results.trx"
          --results-directory ${{ runner.temp }}/test-results

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.os }}
          path: ${{ runner.temp }}/test-results
          if-no-files-found: warn

  publish:
    name: Verify publish
    runs-on: ubuntu-latest
    needs: build-and-test

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Publish the CLI (framework-dependent)
        run: >
          dotnet publish src/Codai.Cli/Codai.Cli.csproj
          --configuration Release
          --output ./publish

      - name: Smoke test the published binary
        run: |
          ./publish/codai --version
          ./publish/codai --help

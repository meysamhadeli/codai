name: Docs

# Mintlify publishes from the connected repository's docs/ directory.
# This workflow validates sources only; it does not deploy to GitHub Pages.

on:
  push:
    branches: ["main"]
    paths:
      - "docs/**"
      - "README.md"
      - ".github/workflows/docs.yml"
  pull_request:
    branches: ["main"]
    paths:
      - "docs/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Validate Mintlify documentation
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: docs/package-lock.json

      - name: Install
        working-directory: docs
        run: npm ci

      - name: Check pages and links
        working-directory: docs
        run: |
          npm test
          npm run check

      - name: Validate Mintlify build
        working-directory: docs
        run: npm run build
